[workspace]
members = [
    "dorimubot-framework",
    "dorimubot-framework-core",
    "dorimubot-axum",
    "dorimubot-commands",
    "dorimubot-commands-macros",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
inventory = "0.3.24"
qqbot-rust-sdk = { version = "0.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"

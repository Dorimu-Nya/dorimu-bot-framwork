[package]
name = "dorimubot-framework"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "All-in-one facade for DorimuBot Framework"

[features]
default = ["axum-webhook", "commands", "commands-macros"]
axum-webhook = ["dep:dorimubot-axum"]
commands = ["dep:dorimubot-commands"]
commands-macros = ["dep:dorimubot-commands-macros"]

[dependencies]
dorimubot-framework-core = { version = "0.0.1" }
dorimubot-axum = { version = "0.0.1", optional = true }
dorimubot-commands = { version = "0.0.1", optional = true }
dorimubot-commands-macros = { version = "0.0.1", optional = true }

[dev-dependencies]
qqbot-rust-sdk = { workspace = true, features = ["openapi"] }
tokio.workspace = true
